name: Quality and secret scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Download and verify official Gitleaks
        run: |
          set -euo pipefail
          mkdir -p .cache/gitleaks
          cd .cache/gitleaks
          curl --fail --silent --show-error --location --remote-name https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --remote-name https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz"' gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
      - name: Scan repository history with Gitleaks
        run: .cache/gitleaks/gitleaks git . --redact --no-banner
